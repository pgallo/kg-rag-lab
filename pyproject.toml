[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-rag-lab"
version = "0.1.0"
description = "Neuro-symbolic retrieval lab: RDF knowledge graph, entity linking, hybrid graph + vector retrieval, LLM-as-judge evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Paolo Gallo" }]
dependencies = [
    "rdflib>=7.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
kgrag = "kgrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgrag = ["data/*.ttl", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]  # str.split word lists read better here
